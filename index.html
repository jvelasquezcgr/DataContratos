<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analista de Expedientes Contractuales</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app-root" data-app>
    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__logo" aria-hidden="true">&#9878;</span>
        <div>
          <h1 class="app-header__title">Analista de Expedientes Contractuales</h1>
          <p class="app-header__subtitle">SECOP II &middot; An&aacute;lisis documental determin&iacute;stico &middot; Sin IA</p>
        </div>
      </div>
      <div id="entity-badge" class="app-header__entity" hidden>
        Entidad: <strong id="entity-name"></strong>
      </div>
    </header>

    <div class="app-shell">
      <aside class="app-sidebar">
        <p class="app-sidebar__label">M&oacute;dulos</p>
        <nav id="app-menu" class="app-menu" aria-label="M&oacute;dulos"></nav>
      </aside>
      <main id="app-main" class="app-main" aria-live="polite"></main>
    </div>

    <footer class="app-footer">
      Consultas basadas en datos abiertos de datos.gov.co. Informaci&oacute;n de car&aacute;cter p&uacute;blico sujeta a disponibilidad de la fuente.
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Punto de entrada unico de la aplicacion -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
